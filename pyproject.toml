[project]
name = "radius"
version = "0.1.0"
description = "Your bookmarks as a searchable corpus, served to agents over an authenticated MCP server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44.0.0",
    "fastmcp>=3.4.4",
    "joserfc>=1.0.0",
    "libsql>=0.1.11",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.5",
]

[project.scripts]
radius = "radius.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radius"]

[tool.pytest.ini_options]
testpaths = ["tests"]
